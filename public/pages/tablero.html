<!DOCTYPE html>
<!-- Responsable: Camila - Tablero Kanban -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Kanban · ScrumFlow</title>

    <!-- Enlaces unificados del equipo -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/componentes/botones.css">
    <link rel="stylesheet" href="../css/componentes/tarjetas.css">
    <link rel="stylesheet" href="../css/componentes/formularios.css">
    <link rel="stylesheet" href="../css/componentes/insignias.css">
    <link rel="stylesheet" href="../css/componentes/modales.css">
    <link rel="stylesheet" href="../css/pages/tablero.css">
</head>

<body>

    <div id="pantalla-tablero" class="h-full flex flex-col p-6" style="padding: var(--espacio-6);">

        <!-- Encabezado del Sprint -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--espacio-4);">
            <div style="display: flex; align-items: center; gap: 12px;">
                <h1 class="titulo-pagina" id="sprint-nombre">Cargando sprint...</h1>
                <span class="insignia insignia--exito" id="sprint-estado">Activo</span>
                <span style="font-size: 13px; color: var(--texto-suave);" id="sprint-dias-restantes">Quedan X días</span>
            </div>

            <div style="display: flex; gap: 8px;">
                <button class="btn btn--primary" id="btn-nueva-tarea">+ Tarea</button>
                <button class="btn btn--secondary" id="btn-configurar-columnas">Configurar</button>
            </div>
        </div>

        <!-- Barra de Filtros -->
        <div class="tarjeta" style="display: flex; align-items: center; gap: 12px; margin-bottom: var(--espacio-4); padding: 12px 16px;">
            <span style="font-size: 13px; color: var(--texto-suave); font-weight: 500;">Filtros:</span>
            <select id="filtro-persona" class="form-select" style="width: auto;">
                <option value="">Persona: Todos</option>
            </select>
            <select id="filtro-epica" class="form-select" style="width: auto;">
                <option value="">Épica: Todas</option>
            </select>
        </div>

        <!-- Contenedor de las Columnas -->
        <div id="tablero-contenedor" style="flex: 1; display: flex; gap: 16px; overflow-x: auto; padding-bottom: 16px;">
            <!-- Columnas inyectadas desde JavaScript -->
        </div>

    </div>

    <!-- Modal de Configuración de Columnas -->
    <dialog id="modal-configurar-columnas" class="modal-card" style="width: 100%; max-width: 440px; padding: var(--espacio-6);">
        <form method="dialog" style="display: flex; flex-direction: column; gap: var(--espacio-4);">
            <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 4px;">Configurar Columnas</h2>
            <div id="lista-config-columnas" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- Inputs inyectados desde JS -->
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
                <button type="button" class="btn btn--secondary" id="btn-cerrar-config-modal">Cancelar</button>
                <button type="button" class="btn btn--primary" id="btn-guardar-config-columnas">Guardar Cambios</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="../js/pages/tablero.js"></script>

</body>

</html>
