<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - ScrumFlow</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/componentes/accesibilidad.css">
    <link rel="stylesheet" href="../css/componentes/botones.css">
    <link rel="stylesheet" href="../css/componentes/formularios.css">
    <link rel="stylesheet" href="../css/componentes/tarjetas.css">
    <link rel="stylesheet" href="../css/componentes/avisos.css">
    <link rel="stylesheet" href="../css/pages/auth.css">
</head>

<body>
    <div class="contenedor-auth">
        <main class="tarjeta-auth tarjeta">
            <h1 class="auth-titulo">Recuperar contraseña</h1>
            <p class="auth-descripcion">Ingresa tu correo para recibir un enlace de recuperación.</p>

            <div id="mensaje-alerta" class="alerta-mensaje" aria-live="polite"></div>

            <form id="form-recuperar">
                <div class="grupo-formulario form-group">
                    <label for="correo" class="etiqueta-formulario form-label">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="entrada-formulario form-input" required
                        autocomplete="email">
                </div>

                <button type="submit" class="boton-auth btn btn--primary">Enviar enlace</button>
            </form>

            <div class="enlaces-auth">
                <a href="login.html" class="enlace">Volver al inicio de sesión</a>
            </div>
        </main>
    </div>
    <script type="module" src="../js/pages/recuperar-password.js"></script>
</body>

</html>
