<!doctype html>
<!--
  Gestión de equipos de trabajo.
  @author Citlaly Morales Viveros
-->
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equipos · ScrumFlow</title>

    <!-- Estilos globales unificados -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/componentes/tarjetas.css" />
    <link rel="stylesheet" href="/css/componentes/botones.css" />
    <link rel="stylesheet" href="/css/componentes/insignias.css" />
    <link rel="stylesheet" href="/css/componentes/esqueletos.css" />
    <link rel="stylesheet" href="/css/componentes/avisos.css" />
    <link rel="stylesheet" href="/css/componentes/notificaciones.css" />
    <link rel="stylesheet" href="/css/componentes/formularios.css" />
    <link rel="stylesheet" href="/css/componentes/modales.css" />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="/css/pages/equipos.css" />

    <link rel="stylesheet" href="/css/componentes/responsive.css" />
    <link rel="stylesheet" href="/css/componentes/accesibilidad.css" />
</head>

<body>
    <header id="barra-superior" class="barra-superior"></header>

    <main class="principal">
        <div class="encabezado-pagina">
            <div>
                <h1 class="titulo-pagina">Equipos</h1>
                <p class="subtitulo-pagina">Administra los equipos de trabajo y a sus integrantes</p>
            </div>
            <button class="boton boton--primario btn btn--primary" id="btn-nuevo-equipo" type="button" hidden>Nuevo equipo</button>
        </div>

        <div id="equipos-mensaje" class="eq-mensaje" role="status" aria-live="polite" hidden></div>

        <section id="equipos-lista" class="equipos__lista" aria-live="polite" aria-label="Lista de equipos"></section>
    </main>

    <dialog id="dialogo-equipo" class="eq-dialogo modal-card" aria-labelledby="equipo-titulo">
        <form id="form-equipo" novalidate>
            <h2 id="equipo-titulo" class="eq-dialogo__titulo"></h2>

            <div id="campo-nombre" class="eq-campo form-group">
                <label class="eq-etiqueta form-label" for="equipo-nombre">Nombre del equipo</label>
                <input id="equipo-nombre" class="eq-input form-input" type="text" maxlength="120" autocomplete="off" />
                <p id="error-nombre" class="eq-error" role="alert" hidden></p>
            </div>

            <div id="seccion-miembros" class="eq-campo form-group">
                <label class="eq-etiqueta form-label" for="buscar-usuarios">Integrantes</label>
                <p id="nota-creador" class="eq-ayuda" hidden>Tú serás integrante del equipo.</p>
                <input id="buscar-usuarios" class="eq-input form-input" type="search" placeholder="Buscar por nombre o correo"
                    autocomplete="off" />
                <ul id="resultados-usuarios" class="eq-resultados" aria-label="Usuarios encontrados"></ul>
                <ul id="elegidos-usuarios" class="eq-chips" aria-label="Usuarios elegidos"></ul>
                <p id="error-miembros" class="eq-error" role="alert" hidden></p>
            </div>

            <p id="error-equipo" class="eq-error" role="alert" hidden></p>
            <div class="eq-dialogo__acciones modal-footer">
                <button class="boton boton--secundario btn btn--secondary" type="button" id="equipo-cancelar">Cancelar</button>
                <button class="boton boton--primario btn btn--primary" type="submit" id="equipo-guardar">Guardar</button>
            </div>
        </form>
    </dialog>

    <dialog id="dialogo-quitar" class="eq-dialogo eq-dialogo--ancho modal-card" aria-labelledby="quitar-titulo">
        <h2 id="quitar-titulo" class="eq-dialogo__titulo">Quitar integrante</h2>
        <div id="quitar-contenido"></div>
        <p id="quitar-error" class="eq-error" role="alert" hidden></p>
        <div class="eq-dialogo__acciones modal-footer">
            <button class="boton boton--secundario btn btn--secondary" type="button" id="quitar-cancelar">Cancelar</button>
            <button class="boton boton--primario btn btn--primary" type="button" id="quitar-confirmar" disabled>Quitar del equipo</button>
        </div>
    </dialog>

    <dialog id="dialogo-eliminar" class="eq-dialogo modal-card" aria-labelledby="eliminar-titulo">
        <h2 id="eliminar-titulo" class="eq-dialogo__titulo">Eliminar equipo</h2>
        <div id="eliminar-contenido"></div>
        <p id="eliminar-error" class="eq-error" role="alert" hidden></p>
        <div class="eq-dialogo__acciones modal-footer">
            <button class="boton boton--secundario btn btn--secondary" type="button" id="eliminar-cancelar">Cancelar</button>
            <button class="boton boton--primario eq-peligro btn btn--danger" type="button" id="eliminar-confirmar">Eliminar equipo</button>
        </div>
    </dialog>

    <script type="module" src="/js/pages/equipos.js"></script>
</body>

</html>
