<!DOCTYPE html>
<!-- Responsable: Diego - HU-10: pantalla de Daily Scrum. Solo el contenido del area de trabajo; el menu lo pone layout.js -->
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/componentes/compatibilidad.js"></script>
  <title>Daily Scrum · ScrumFlow</title>

  <!-- Estilos globales unificados -->
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/componentes/tarjetas.css" />
  <link rel="stylesheet" href="../css/componentes/botones.css" />
  <link rel="stylesheet" href="../css/componentes/formularios.css" />
  <link rel="stylesheet" href="../css/componentes/insignias.css" />
  <link rel="stylesheet" href="../css/componentes/avisos.css" />
  <link rel="stylesheet" href="../css/componentes/esqueletos.css" />
  <link rel="stylesheet" href="../css/componentes/notificaciones.css" />

  <link rel="stylesheet" href="../css/componentes/responsive.css" />
  <link rel="stylesheet" href="../css/componentes/accesibilidad.css" />
</head>

<body>
  <header id="barra-superior" class="barra-superior"></header>

  <main class="principal">
    <div class="encabezado-pagina">
      <div>
        <h1 class="titulo-pagina">Daily Scrum</h1>
        <p class="subtitulo-pagina" id="subtitulo">Qué hice, qué haré y qué me estorba.</p>
      </div>
      <div class="daily-herramientas">
        <select class="form-input" id="selector-proyecto" aria-label="Proyecto" hidden></select>
        <label class="solo-lectores" for="selector-fecha">Fecha de la Daily</label>
        <input class="form-input" id="selector-fecha" type="date" />
        <button class="boton boton--secundario" id="btn-hoy" type="button">Hoy</button>
      </div>
    </div>

    <div id="aviso" class="daily-aviso" role="status" aria-live="polite" hidden></div>

    <div class="daily" id="contenido" aria-busy="true">
      <section class="tarjeta" id="tarjeta-mia" aria-labelledby="titulo-mia">
        <h2 class="daily__titulo" id="titulo-mia">Mi Daily</h2>
        <p class="daily__ayuda" id="ayuda-mia">Cuéntale al equipo en qué estás.</p>

        <form class="daily-form" id="form-daily" novalidate hidden>
          <div class="form-group">
            <label class="form-label" for="campo-ayer">¿Qué hice ayer?</label>
            <textarea class="form-input" id="campo-ayer" name="ayer" rows="3" maxlength="2000"></textarea>
            <p class="daily-form__error" id="error-ayer" hidden></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="campo-hoy">¿Qué haré hoy?</label>
            <textarea class="form-input" id="campo-hoy" name="hoy" rows="3" maxlength="2000"></textarea>
            <p class="daily-form__error" id="error-hoy" hidden></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="campo-impedimentos">¿Tengo impedimentos? <span
                class="subtitulo-pagina">(opcional)</span></label>
            <textarea class="form-input" id="campo-impedimentos" name="impedimentos" rows="2"
              maxlength="2000"></textarea>
            <p class="daily-form__error" id="error-impedimentos" hidden></p>
          </div>

          <div class="form-group">
            <span class="form-label" id="etiqueta-tareas">Tareas del tablero relacionadas</span>
            <div class="chips" id="chips-tareas" role="group" aria-labelledby="etiqueta-tareas"></div>
            <p class="daily-form__error" id="error-tareas" hidden></p>
          </div>

          <div class="daily-form__acciones">
            <button class="boton boton--primario" id="btn-guardar" type="submit">Guardar mi Daily</button>
            <a class="boton boton--secundario" id="enlace-impedimentos" href="impedimentos.html">Registrar un
              impedimento</a>
            <span class="daily-form__estado" id="estado-form" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <section class="tarjeta" aria-labelledby="titulo-equipo">
        <h2 class="daily__titulo" id="titulo-equipo">Estado del equipo</h2>
        <p class="daily__ayuda" id="ayuda-equipo"></p>
        <div class="daily-resumen" id="resumen" aria-live="polite"></div>
        <ul class="daily-lista" id="lista-equipo"></ul>
      </section>
    </div>
  </main>

  <script src="../socket.io/socket.io.js"></script>
  <script type="module" src="../js/pages/daily.js"></script>
</body>

</html>
