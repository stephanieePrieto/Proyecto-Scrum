<!DOCTYPE html>

<html lang="es">
<head>

  <link rel="stylesheet" href="/css/base.css" />

<body>

      <p id="rp-dod" style="background: var(--slate-50); padding: 12px; border-radius: 8px; font-family: monospace; white-space: pre-line;"></p>
