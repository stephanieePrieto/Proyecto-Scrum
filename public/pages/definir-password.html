<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir Contraseña - ScrumFlow</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <div class="contenedor-auth">
        <main class="tarjeta tarjeta-auth">
            <header class="auth-encabezado">
                <h1 class="titulo-pagina">Definir Contraseña</h1>
            </header>

            <div id="mensaje" role="alert" aria-live="polite"></div>

            <form id="formPassword">
                <div class="grupo-formulario">
                    <label class="etiqueta-formulario" for="password">Nueva contraseña</label>
                    <input class="entrada-formulario" type="password" id="password" name="password" required>
                    <small class="eq-ayuda">Mínimo 8 caracteres, con mayúscula, minúscula y número.</small>
                </div>

                <div class="grupo-formulario">
                    <label class="etiqueta-formulario" for="confirmPassword">Confirmar contraseña</label>
                    <input class="entrada-formulario" type="password" id="confirmPassword" name="confirmPassword"
                        required>
                </div>

                <button type="submit" class="boton boton--primario boton--bloque">Definir Contraseña</button>
            </form>
        </main>
    </div>
    <script type="module" src="/js/pages/definir-password.js"></script>
</body>

</html>
