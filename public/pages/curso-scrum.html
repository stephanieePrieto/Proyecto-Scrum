<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/js/componentes/compatibilidad.js"></script>
  <title>Curso de Scrum · ScrumFlow</title>

  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Estilos de la aplicación y página -->
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/componentes/tarjetas.css" />
  <link rel="stylesheet" href="../css/componentes/botones.css" />
  <link rel="stylesheet" href="../css/componentes/insignias.css" />
  <link rel="stylesheet" href="../css/componentes/avisos.css" />
  <link rel="stylesheet" href="../css/componentes/curso-scrum.css" />
  <link rel="stylesheet" href="/css/componentes/responsive.css">
</head>
<body>
  <header id="barra-superior" class="barra-superior"></header>

  <main class="principal curso-contenedor">
    <!-- Encabezado del curso -->
    <div class="encabezado-curso">
      <div>
        <h1><i class="fas fa-graduation-cap"></i> Curso de Scrum</h1>
        <p class="subtitulo">Aprende los fundamentos de Scrum y cómo aplicarlos en ScrumFlow</p>
      </div>
      
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <!-- Botón exclusivo para Scrum Master / Product Owner (se muestra vía JS) -->
        <a href="./avance-curso.html" id="btn-avance-equipo" class="boton boton--primario" style="display: none;">
          <i class="fas fa-chart-line"></i> Avance del Equipo
        </a>

        <!-- Botón de regresar -->
        <a href="./dashboard.html" class="boton boton--secundario boton-regresar">
          <i class="fas fa-arrow-left"></i> Regresar
        </a>
      </div>
    </div>

    <!-- Barra de progreso principal -->
    <div class="barra-progreso-principal">
      <div class="barra-progreso-relleno" id="barra-progreso" style="width: 0%;"></div>
    </div>
    <div class="porcentaje-avance" id="porcentaje-avance">Avance: 0%</div>

    <!-- Alerta de certificado con botón de acción dinámico -->
    <div class="certificado-alerta" id="certificado-alerta">
      <div class="certificado-icono">
        <i class="fas fa-trophy"></i>
      </div>
      <div class="certificado-mensaje" style="flex: 1;">
        <h3>¡Felicidades!</h3>
        <p>Has completado satisfactoriamente el curso de Scrum.</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="btn-descargar-certificado" type="button" class="boton btn-curso--secundario">
          <i class="fas fa-file-pdf"></i> Descargar Certificado (PDF)
        </button>
      </div>
    </div>

    <!-- Contenido dinámico del curso -->
    <div id="contenido-curso"></div>
  </main>

  <!-- Modal para Quiz -->
  <div id="modal-quiz" class="modal" style="display: none;">
    <div class="modal-contenido">
      <div class="modal-encabezado">
        <h2 id="modal-quiz-titulo">Quiz: <span id="quiz-leccion-titulo"></span></h2>
        <button class="modal-cerrar" id="btn-cerrar-quiz">&times;</button>
      </div>
      <div id="quiz-contenido"></div>
      <div class="modal-pie">
        <button class="boton boton--primario" id="btn-enviar-quiz" style="display: none;">
          <i class="fas fa-paper-plane"></i> Enviar Respuestas
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/pages/curso-scrum.js"></script>
</body>
</html>
