  @author Citlaly Morales Viveros
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - ScrumFlow</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/componentes/accesibilidad.css">
    <link rel="stylesheet" href="../css/componentes/botones.css">
    <link rel="stylesheet" href="../css/componentes/formularios.css">
    <link rel="stylesheet" href="../css/componentes/tarjetas.css">
    <link rel="stylesheet" href="../css/componentes/avisos.css">
</head>

<body>
    <div class="contenedor-auth">
        <main class="tarjeta tarjeta-auth">
            <div class="auth-encabezado">
                <h1 class="titulo-pagina">Crear nueva contraseña</h1>
                <p class="subtitulo-pagina">Ingresa tu nueva contraseña para continuar.</p>
            </div>

            <div id="mensaje-alerta" class="alerta" role="status" aria-live="polite" hidden></div>

            <form id="form-restablecer">
                <div class="form-group">
                    <label for="nueva-password" class="form-label">Nueva contraseña</label>
                    <input type="password" id="nueva-password" name="nueva-password" class="form-input" required
                        autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmar-password" class="form-label">Confirmar contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar-password" class="form-input" required
                        autocomplete="new-password">
                </div>

                <button type="submit" class="boton boton--primario boton--bloque">Actualizar contraseña</button>
            </form>

            <div class="enlaces-auth">
                <a href="login.html" class="enlace">Volver al inicio de sesión</a>
            </div>
        </main>
    </div>
    <script type="module" src="../js/pages/restablecer-password.js"></script>
</body>

</html>
