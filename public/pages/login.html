  @file login.html

  @author Citlaly Morales Viveros
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ScrumFlow</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/pages/auth.css">
</head>

<body>
    <div class="contenedor-auth">
        <main class="tarjeta-auth">
            <h1 class="auth-titulo">ScrumFlow</h1>
            <p class="auth-descripcion">Ingresa tus credenciales para continuar</p>

            <div id="mensaje-alerta" class="alerta-mensaje" aria-live="polite"></div>

            <form id="form-login">
                <div class="grupo-formulario">
                    <label for="correo" class="etiqueta-formulario">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="entrada-formulario" required
                        autocomplete="email">
                </div>

                <div class="grupo-formulario">
                    <label for="password" class="etiqueta-formulario">Contraseña</label>
                    <input type="password" id="password" name="password" class="entrada-formulario" required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="boton-auth">Iniciar Sesión</button>
            </form>

            <div class="enlaces-auth">
                <a href="recuperar-password.html" class="enlace">¿Olvidaste tu contraseña?</a>
            </div>
        </main>
    </div>
    <script type="module" src="../js/pages/login.js"></script>
</body>

</html>
