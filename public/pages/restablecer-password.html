<!--
  @file restablecer-password.html
  @description Interfaz para definir una nueva contraseña tras validar el token de recuperación.
  @author Citlaly Morales Viveros
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - ScrumFlow</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/pages/auth.css">
</head>

<body>
    <div class="contenedor-auth">
        <main class="tarjeta-auth">
            <h1 class="auth-titulo">Crear nueva contraseña</h1>
            <p class="auth-descripcion">Ingresa tu nueva contraseña para continuar.</p>

            <div id="mensaje-alerta" class="alerta-mensaje" aria-live="polite"></div>

            <form id="form-restablecer">
                <div class="grupo-formulario">
                    <label for="nueva-password" class="etiqueta-formulario">Nueva contraseña</label>
                    <input type="password" id="nueva-password" name="nueva-password" class="entrada-formulario" required
                        autocomplete="new-password">
                </div>

                <div class="grupo-formulario">
                    <label for="confirmar-password" class="etiqueta-formulario">Confirmar contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar-password" class="entrada-formulario"
                        required autocomplete="new-password">
                </div>

                <button type="submit" class="boton-auth">Actualizar contraseña</button>
            </form>

            <div class="enlaces-auth">
                <a href="login.html" class="enlace">Volver al inicio de sesión</a>
            </div>
        </main>
    </div>
    <script type="module" src="../js/pages/restablecer-password.js"></script>
</body>

</html>
