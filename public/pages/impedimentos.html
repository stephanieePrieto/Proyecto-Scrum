<!DOCTYPE html>
<!-- Responsable: Diego - HU-11: pantalla de impedimentos. Solo el contenido del area de trabajo; el menu lo pone layout.js -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/componentes/compatibilidad.js"></script>
  <title>Impedimentos · ScrumFlow</title>

  <!-- Estilos globales unificados -->
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/componentes/tarjetas.css" />
  <link rel="stylesheet" href="../css/componentes/botones.css" />
  <link rel="stylesheet" href="../css/componentes/formularios.css" />
  <link rel="stylesheet" href="../css/componentes/insignias.css" />
  <link rel="stylesheet" href="../css/componentes/avisos.css" />
  <link rel="stylesheet" href="../css/componentes/esqueletos.css" />
  <link rel="stylesheet" href="../css/componentes/notificaciones.css" />

  <link rel="stylesheet" href="../css/componentes/responsive.css" />
  <link rel="stylesheet" href="../css/componentes/accesibilidad.css" />
</head>
<body>
  <header id="barra-superior" class="barra-superior"></header>

  <main class="principal">
    <div class="encabezado-pagina">
      <div>
        <h1 class="titulo-pagina">Impedimentos</h1>
        <p class="subtitulo-pagina">Registra lo que te bloquea para que se atienda rápido.</p>
      </div>
      <div class="imp-herramientas">
        <select class="form-input" id="selector-proyecto" aria-label="Proyecto" hidden></select>
        <button class="boton boton--primario" id="btn-nuevo" type="button" disabled>+ Registrar impedimento</button>
      </div>
    </div>

    <div id="aviso" class="imp-aviso" role="status" aria-live="polite" hidden></div>

    <section class="imp-resumen" aria-label="Resumen">
      <div class="tarjeta imp-dato">
        <div class="imp-dato__valor" id="dato-abiertos">–</div>
        <div class="imp-dato__etiqueta">Abiertos</div>
      </div>
      <div class="tarjeta imp-dato imp-dato--peligro">
        <div class="imp-dato__valor" id="dato-vencidos">–</div>
        <div class="imp-dato__etiqueta" id="etiqueta-vencidos">Abiertos por más de 3 días</div>
      </div>
      <div class="tarjeta imp-dato imp-dato--exito">
        <div class="imp-dato__valor" id="dato-resueltos">–</div>
        <div class="imp-dato__etiqueta">Resueltos</div>
      </div>
    </section>

    <div class="imp-filtros">
      <label class="solo-lectores" for="filtro-estado">Estado</label>
      <select class="form-input" id="filtro-estado">
        <option value="abierto">Abiertos</option>
        <option value="resuelto">Resueltos</option>
        <option value="todos">Todos</option>
      </select>
      <label class="solo-lectores" for="filtro-severidad">Severidad</label>
      <select class="form-input" id="filtro-severidad">
        <option value="">Toda severidad</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>
    </div>

    <ul class="imp-lista" id="lista" aria-busy="true"></ul>
  </main>

  <dialog class="imp-dialogo" id="dialogo-nuevo" aria-labelledby="dialogo-titulo">
    <form class="imp-dialogo__cuerpo" id="form-nuevo" novalidate>
      <h2 class="imp-dialogo__titulo" id="dialogo-titulo">Registrar impedimento</h2>

      <div class="form-group">
        <label class="form-label" for="campo-titulo">¿Qué te está bloqueando?</label>
        <input class="form-input" id="campo-titulo" name="titulo" type="text" maxlength="200" autocomplete="off" />
        <p class="imp-error" id="error-titulo" hidden></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="campo-severidad">Severidad</label>
        <select class="form-input" id="campo-severidad" name="severidad">
          <option value="baja">Baja: puedo avanzar con otras cosas</option>
          <option value="media" selected>Media: frena parte de mi trabajo</option>
          <option value="alta">Alta: me tiene detenido</option>
        </select>
        <p class="imp-error" id="error-severidad" hidden></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="campo-responsable">Responsable de resolverlo</label>
        <select class="form-input" id="campo-responsable" name="responsable_id"></select>
        <p class="imp-error" id="error-responsable_id" hidden></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="campo-tarea">Tarea afectada <span class="subtitulo-pagina">(opcional)</span></label>
        <select class="form-input" id="campo-tarea" name="tarea_id"></select>
        <p class="imp-error" id="error-tarea_id" hidden></p>
      </div>

      <p class="imp-error" id="error-general" role="alert" hidden></p>

      <div class="imp-dialogo__acciones">
        <button class="boton boton--secundario" id="btn-cancelar" type="button">Cancelar</button>
        <button class="boton boton--primario" id="btn-crear" type="submit">Registrar</button>
      </div>
    </form>
  </dialog>

  <script src="../socket.io/socket.io.js"></script>
  <script type="module" src="../js/pages/impedimentos.js"></script>
</body>
</html>
