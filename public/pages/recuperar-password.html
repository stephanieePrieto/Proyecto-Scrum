<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - ScrumFlow</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/componentes/accesibilidad.css">
    <link rel="stylesheet" href="../css/componentes/botones.css">
    <link rel="stylesheet" href="../css/componentes/formularios.css">
    <link rel="stylesheet" href="../css/componentes/tarjetas.css">
    <link rel="stylesheet" href="../css/componentes/avisos.css">
</head>

<body>
    <div class="contenedor-auth">
        <main class="tarjeta tarjeta-auth">
            <div class="auth-encabezado">
                <h1 class="titulo-pagina">Recuperar contraseña</h1>
                <p class="subtitulo-pagina">Ingresa tu correo para recibir un enlace de recuperación.</p>
            </div>

            <div id="mensaje-alerta" class="alerta" role="status" aria-live="polite" hidden></div>

            <form id="form-recuperar">
                <div class="form-group">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-input" required autocomplete="email">
                </div>

                <button type="submit" class="boton boton--primario boton--bloque">Enviar enlace</button>
            </form>

            <div class="enlaces-auth">
                <a href="/pages/login.html" class="enlace">Volver al inicio de sesión</a>
            </div>
        </main>
    </div>
    <script type="module" src="../js/pages/recuperar-password.js"></script>
</body>

</html>
