<!DOCTYPE html>
<!-- HU-35: Dashboard de KPIs y Proyectos. -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · ScrumFlow</title>

  <!-- Estilos globales unificados -->
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/componentes/tarjetas.css" />
  <link rel="stylesheet" href="/css/componentes/botones.css" />
  <link rel="stylesheet" href="/css/componentes/insignias.css" />
  <link rel="stylesheet" href="/css/componentes/esqueletos.css" />
  <link rel="stylesheet" href="/css/componentes/avisos.css" />
  <link rel="stylesheet" href="/css/componentes/notificaciones.css">
  <link rel="stylesheet" href="/css/componentes/formularios.css" />
  <link rel="stylesheet" href="/css/componentes/modales.css" />

  <!-- Estilos de KPIs del dashboard (tarjetas, barras de progreso y bloque de DoD) -->
  <link rel="stylesheet" href="/css/componentes/metricas.css" />

  <link rel="stylesheet" href="/css/componentes/responsive.css" />
  <link rel="stylesheet" href="/css/componentes/accesibilidad.css" />
</head>
<body>
  <header id="barra-superior" class="barra-superior"></header>

  <main class="principal">
    <section id="proyectos" class="proyectos" aria-labelledby="proyectos-titulo">
      <div class="proyectos__cabecera">
        <h1 id="proyectos-titulo" class="titulo-pagina">Proyectos</h1>
        <div class="proyectos__acciones">
          <label class="proyectos__archivados"><input type="checkbox" id="ver-archivados" /> Ver archivados</label>
          <a id="btn-nuevo-proyecto" class="boton boton--primario btn btn--primary" href="/pages/configuracion-proyecto.html" hidden>Nuevo proyecto</a>
        </div>
      </div>
      <p id="proyectos-error" class="proyectos__error" role="alert" hidden></p>
      <div id="proyectos-lista" class="proyectos__lista" aria-live="polite"></div>
    </section>

    <div class="encabezado-pagina">
      <div>
        <h2 id="dashboard-titulo" class="titulo-pagina">Dashboard del proyecto</h2>
        <p id="dashboard-subtitulo" class="subtitulo-pagina">Estado general de un vistazo</p>
      </div>
      <button class="boton boton--secundario btn btn--secondary" id="btn-actualizar" type="button">Actualizar</button>
    </div>

    <section id="aviso-vacio" class="aviso aviso--vacio" hidden>
      <div class="aviso__icono" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      </div>
      <h2 class="aviso__titulo">Aún no hay datos para mostrar</h2>
      <p class="aviso__texto">Crea tu primer sprint y agrega historias al backlog. Los indicadores aparecerán aquí.</p>
      <a class="boton boton--primario btn btn--primary" href="/pages/backlog.html">Ir al backlog</a>
    </section>

    <section id="kpi-grilla" class="kpi-grilla" aria-live="polite" aria-label="Indicadores del proyecto"></section>
  </main>

  <dialog id="dialogo-archivar-proyecto" class="proy-dialogo-dash modal-card" aria-labelledby="archivar-proyecto-titulo">
    <h2 id="archivar-proyecto-titulo">¿Archivar este proyecto?</h2>
    <p><span id="archivar-proyecto-nombre"></span> saldrá de la lista pero conservará todo su historial.</p>
    <div class="proy-dialogo-dash__acciones modal-footer">
      <button class="boton boton--secundario btn btn--secondary" type="button" id="archivar-proyecto-cancelar">Cancelar</button>
      <button class="boton boton--primario btn btn--primary" type="button" id="archivar-proyecto-confirmar">Archivar proyecto</button>
    </div>
  </dialog>

  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
