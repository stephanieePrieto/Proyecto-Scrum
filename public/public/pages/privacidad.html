<!DOCTYPE html>
<!--
    @file privacidad.html
    @description Página del aviso de privacidad de ScrumFlow. Es pública: la leen las personas que se registran
    y también las que deben aceptar una versión nueva al iniciar sesión (con el parámetro pendiente=1).
    No usa la barra de navegación, porque esa barra consulta la sesión y una persona sin sesión sería enviada al login.

    @author Citlaly Morales Viveros
-->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/componentes/compatibilidad.js"></script>
    <title>Aviso de privacidad - ScrumFlow</title>
    <!-- Estilos unificados del sistema -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/componentes/accesibilidad.css">
    <link rel="stylesheet" href="../css/componentes/botones.css">
    <link rel="stylesheet" href="../css/componentes/formularios.css">
    <link rel="stylesheet" href="../css/componentes/tarjetas.css">
    <link rel="stylesheet" href="../css/componentes/avisos.css">
    <link rel="stylesheet" href="/css/componentes/responsive.css">
</head>

<body>
    <a class="saltar-contenido" href="#contenido-principal">Saltar al contenido principal</a>
    <div class="contenedor-auth">
        <main class="tarjeta tarjeta-auth tarjeta-auth--ancha" id="contenido-principal">
            <div class="auth-encabezado">
                <h1 class="titulo-pagina">Aviso de privacidad</h1>
                <p class="subtitulo-pagina" id="subtitulo-aviso">Cargando...</p>
            </div>

            <div id="mensaje" class="alerta" role="status" aria-live="polite" hidden></div>

            <article id="contenido-aviso"></article>

            <div id="bloque-aceptar" hidden>
                <p>Para seguir usando ScrumFlow debes aceptar esta versión del aviso.</p>
                <button type="button" id="btn-aceptar" class="boton boton--primario boton--bloque">Acepto el aviso de
                    privacidad</button>
            </div>

            <div class="enlaces-auth">
                <a href="login.html" class="enlace">Volver al inicio de sesión</a>
            </div>
        </main>
    </div>
    <script type="module" src="../js/pages/privacidad.js"></script>
</body>

</html>
