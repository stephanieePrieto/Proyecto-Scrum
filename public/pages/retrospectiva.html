<!DOCTYPE html>
<!-- Responsable: Diego - HU-13, HU-14: pantalla de retrospectiva y acciones pendientes. Solo el contenido del area de trabajo; el menu lo pone layout.js -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/componentes/compatibilidad.js"></script>
  <title>Retrospectiva · ScrumFlow</title>

  <!-- Estilos globales unificados (los estilos de la retro viven en daily.css, junto a los de las demás ceremonias) -->
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/componentes/tarjetas.css" />
  <link rel="stylesheet" href="../css/componentes/botones.css" />
  <link rel="stylesheet" href="../css/componentes/formularios.css" />
  <link rel="stylesheet" href="../css/componentes/insignias.css" />
  <link rel="stylesheet" href="../css/componentes/avisos.css" />
  <link rel="stylesheet" href="../css/componentes/daily.css" />
  <link rel="stylesheet" href="../css/componentes/esqueletos.css" />
  <link rel="stylesheet" href="../css/componentes/notificaciones.css" />

  <link rel="stylesheet" href="../css/componentes/responsive.css" />
  <link rel="stylesheet" href="../css/componentes/accesibilidad.css" />
</head>
<body>
  <header id="barra-superior" class="barra-superior"></header>

  <main class="principal">
    <div class="encabezado-pagina">
      <div>
        <h1 class="titulo-pagina">Retrospectiva</h1>
        <p class="subtitulo-pagina" id="subtitulo">Qué salió bien, qué mejorar y qué haremos al respecto.</p>
      </div>
      <div class="daily-herramientas">
        <label class="solo-lectores" for="selector-sprint">Sprint</label>
        <select class="form-input" id="selector-sprint" disabled></select>
        <span class="insignia insignia--info" id="insignia-votos" hidden></span>
        <span data-permiso="retro.gestionar">
          <button class="boton boton--primario" id="btn-cerrar" type="button" hidden>Cerrar retrospectiva</button>
        </span>
      </div>
    </div>

    <div id="aviso" class="daily-aviso" role="status" aria-live="polite" hidden></div>

    <!-- HU-14: acciones de retros anteriores que siguen pendientes -->
    <div id="pendientes" hidden></div>

    <div class="retro" id="tablero" aria-busy="true" hidden>
      <section class="tarjeta retro__columna" aria-labelledby="titulo-bien">
        <h2 class="daily__titulo" id="titulo-bien">Qué salió bien</h2>
        <form class="retro-form" data-columna="bien" novalidate>
          <label class="solo-lectores" for="texto-bien">Nueva nota en Qué salió bien</label>
          <textarea class="form-input" id="texto-bien" name="texto" rows="2" maxlength="500" placeholder="Algo que funcionó…"></textarea>
          <p class="daily-form__error" id="error-bien" hidden></p>
          <div class="retro-form__fila">
            <label class="retro-form__anonimo"><input type="checkbox" name="anonimo" /> Publicar de forma anónima</label>
            <button class="boton boton--primario boton--pequeno" type="submit">Agregar</button>
          </div>
        </form>
        <ul class="retro-notas" id="notas-bien"></ul>
      </section>

      <section class="tarjeta retro__columna" aria-labelledby="titulo-mejorar">
        <h2 class="daily__titulo" id="titulo-mejorar">Qué mejorar</h2>
        <form class="retro-form" data-columna="mejorar" novalidate>
          <label class="solo-lectores" for="texto-mejorar">Nueva nota en Qué mejorar</label>
          <textarea class="form-input" id="texto-mejorar" name="texto" rows="2" maxlength="500" placeholder="Algo que nos frenó…"></textarea>
          <p class="daily-form__error" id="error-mejorar" hidden></p>
          <div class="retro-form__fila">
            <label class="retro-form__anonimo"><input type="checkbox" name="anonimo" /> Publicar de forma anónima</label>
            <button class="boton boton--primario boton--pequeno" type="submit">Agregar</button>
          </div>
        </form>
        <ul class="retro-notas" id="notas-mejorar"></ul>
      </section>

      <section class="tarjeta retro__columna" aria-labelledby="titulo-acciones">
        <h2 class="daily__titulo" id="titulo-acciones">Acciones</h2>
        <form class="retro-form" id="form-accion" novalidate>
          <label class="solo-lectores" for="accion-texto">Acción de mejora</label>
          <textarea class="form-input" id="accion-texto" name="texto" rows="2" maxlength="300" placeholder="Qué haremos para mejorar…"></textarea>
          <p class="daily-form__error" id="error-accion-texto" hidden></p>
          <div class="retro-form__fila">
            <div class="form-group">
              <label class="form-label" for="accion-responsable">Responsable</label>
              <select class="form-input" id="accion-responsable" name="responsable_id"></select>
              <p class="daily-form__error" id="error-accion-responsable_id" hidden></p>
            </div>
            <div class="form-group">
              <label class="form-label" for="accion-fecha">Fecha límite</label>
              <input class="form-input" id="accion-fecha" name="fecha_limite" type="date" />
              <p class="daily-form__error" id="error-accion-fecha_limite" hidden></p>
            </div>
          </div>
          <button class="boton boton--primario boton--pequeno" type="submit">Crear acción</button>
        </form>
        <ul class="retro-notas" id="lista-acciones"></ul>
      </section>
    </div>
  </main>

  <script src="../socket.io/socket.io.js"></script>
  <script type="module" src="../js/pages/retrospectiva.js"></script>
</body>
</html>
